spring:
  profiles:
    active: local

---
spring:
  profiles: local
  cloud:
    nacos:
      config:
        enabled: false
  application:
    name: app-knowledge-service
  main:
    allow-bean-definition-overriding: true

---
spring:
  profiles: dev
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: 10.10.20.90:8848
        prefix: app-knowledge-service
        file-extension: yml
  application:
    name: app-knowledge-service
  main:
    allow-bean-definition-overriding: true

