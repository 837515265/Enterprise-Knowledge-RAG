services:
  app-rag-doc:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-rag-doc:latest
    container_name: app-rag-doc
    restart: unless-stopped
    env_file:
      - ${DANBAO_ENV_FILE:-.env.deploy}
    environment:
      SERVICE_NAME: app-rag-doc
      APP_ENV: "${APP_ENV:-sit}"
      APP_PORT: "${APP_PORT:-20751}"
      NACOS_CONFIG_DATA_ID: "${NACOS_CONFIG_DATA_ID:-app-rag-doc-sit}"
      DATA_DIR: /app/data
      LOG_DIR: /home/appuser/app/logs
      PARSE_PORT: "${APP_PORT:-20751}"
      RETRIEVE_PORT: "${APP_PORT:-20751}"
      NACOS_PARSE_REGISTER_PORT: "${APP_PORT:-20751}"
      NACOS_RETRIEVE_REGISTER_PORT: "${APP_PORT:-20751}"
      NEO4J_CONSTRAINTS_PATH: /app/cypher/constraints.cypher
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/home/appuser/app/logs
      - ./cypher:/app/cypher:ro
    ports:
      - "${APP_PORT:-20751}:${APP_PORT:-20751}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:20751/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
