[project]
name = "danbao-poc"
version = "0.1.0"
description = "Guarantee-plan parsing, indexing, and retrieval services"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "elasticsearch>=7.17,<8",
  "neo4j>=5.26,<6",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.24,<2",
  "pymysql>=1.1,<2",
  "PyYAML>=6,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<6",
  "requests>=2.31,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.27,<1",
  "jieba>=0.42",
]

[project.optional-dependencies]
graphrag = [
  "pandas>=2.2,<3",
  "pyarrow>=15,<16",
]

[tool.uv]
package = false
